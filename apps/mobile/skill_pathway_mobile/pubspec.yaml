name: skill_pathway
description: A clean, modern, and trustworthy mobile app splash and onboarding language-selection screen for Skill Pathway.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  cupertino_icons: ^1.0.6
  flutter_local_notifications: ^22.3.1
  shared_preferences: ^2.5.5
  http: ^1.2.0
  go_router: ^18.0.1
  supabase_flutter: ^2.17.2
  provider: ^6.1.5+1
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
